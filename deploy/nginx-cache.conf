# Кэш и сжатие статики. Подключается внутрь server-блока сайта:
#   include /etc/nginx/snippets/mr-black-cache.conf;
#
# До этого cache-control приходил только на .js и .mp4, а шрифты и картинки
# из _astro/ перекачивались при каждом заходе — 647 КБ на визит.
#
# Префиксы намеренно с `^~`: без него любой regex-location в основном конфиге
# (например `~* \.(js|css)$ { expires 45d; }`) перебьёт эти правила.
# `expires off` глушит унаследованный expires, чтобы Cache-Control не задвоился.

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
# woff2/webp/mp4/glb уже сжаты — их сюда не добавлять.
gzip_types
	text/plain
	text/css
	text/javascript
	application/javascript
	application/json
	application/manifest+json
	application/wasm
	image/svg+xml;

# Имена с хэшем содержимого — можно кэшировать навсегда.
location ^~ /_astro/ {
	expires off;
	add_header Cache-Control 'public, max-age=31536000, immutable';
	access_log off;
}

# Шрифты и декодер draco меняются только вместе с релизом.
location ^~ /fonts/ {
	expires off;
	add_header Cache-Control 'public, max-age=31536000, immutable';
	access_log off;
}

location ^~ /draco/ {
	expires off;
	add_header Cache-Control 'public, max-age=31536000, immutable';
	access_log off;
}

# Остальная статика без хэша в имени — месяц с ревалидацией по ETag.
location ~* \.(?:glb|mp4|webp|png|jpe?g|svg|ico|woff2?)$ {
	expires off;
	add_header Cache-Control 'public, max-age=2592000';
	access_log off;
}

# HTML переписывается каждым деплоем — только ревалидация.
location ~* \.html$ {
	expires off;
	add_header Cache-Control 'public, max-age=0, must-revalidate';
}

location = / {
	expires off;
	add_header Cache-Control 'public, max-age=0, must-revalidate';
}
